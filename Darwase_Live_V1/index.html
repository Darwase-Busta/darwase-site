<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110020">
  <meta name="description" content="Darwase — 21st-Century Renaissance Man">
  <title>Darwase</title>
  <style>
    :root {
      --bg: #08000f;
      --panel: #150025;
      --purple: #b23cff;
      --pink: #ff3ec9;
      --cyan: #27e6ff;
      --text: #f4eaff;
      --muted: #bea8cf;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(178, 60, 255, .22), transparent 38rem),
        linear-gradient(180deg, #08000f, #12001f 65%, #08000f);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .site {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .hero {
      overflow: hidden;
      border: 1px solid rgba(190, 120, 255, .45);
      border-radius: 22px;
      background: #07000c;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.03) inset,
        0 0 50px rgba(178, 60, 255, .18);
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .menu a {
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(190, 120, 255, .35);
      border-radius: 17px;
      background:
        linear-gradient(145deg, rgba(178,60,255,.16), rgba(20,0,35,.88));
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .menu a:hover {
      transform: translateY(-4px);
      border-color: var(--pink);
      box-shadow: 0 10px 35px rgba(255, 62, 201, .12);
    }

    .number {
      color: var(--cyan);
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: .12em;
    }

    .label {
      font-size: clamp(15px, 1.5vw, 22px);
      font-weight: 750;
      letter-spacing: -.02em;
    }

    .status {
      margin: 22px 0 8px;
      text-align: center;
      color: var(--muted);
      font: 500 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: .08em;
    }

    @media (max-width: 780px) {
      .site { padding: 10px; }
      .hero { border-radius: 14px; }
      .menu { grid-template-columns: 1fr 1fr; gap: 9px; }
      .menu a { min-height: 78px; padding: 14px; }
    }

    @media (max-width: 430px) {
      .menu { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="site">
    <section class="hero">
      <img src="darwase-hero.png" alt="Darwase neon synthwave artwork">
    </section>

    <nav class="menu" aria-label="Darwase sections">
      <a href="#about" onclick="comingSoon(event)">
        <span class="number">00</span>
        <span class="label">About Me</span>
      </a>

      <a href="#discovery" onclick="comingSoon(event)">
        <span class="number">01</span>
        <span class="label">Islamic Discovery</span>
      </a>

      <a href="#prompts" onclick="comingSoon(event)">
        <span class="number">02</span>
        <span class="label">Free Prompts</span>
      </a>

      <a href="#labs" onclick="comingSoon(event)">
        <span class="number">03</span>
        <span class="label">Labs</span>
      </a>
    </nav>

    <p class="status" id="status">DARWASE / SYSTEM ACTIVE / MORE COMING SOON</p>
  </main>

  <script>
    function comingSoon(event) {
      event.preventDefault();
      const status = document.getElementById("status");
      status.textContent = "SECTION UNDER CONSTRUCTION / STAY CURIOUS";
      setTimeout(() => {
        status.textContent = "DARWASE / SYSTEM ACTIVE / MORE COMING SOON";
      }, 1800);
    }
  </script>
</body>
</html>
