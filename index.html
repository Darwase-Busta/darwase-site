<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#10001d">

  <meta
    name="description"
    content="Darwase — 21st-Century Renaissance Man"
  >

  <title>Darwase</title>

  <style>
    :root {
      --background-dark: #07000d;
      --background-purple: #1b0038;

      --purple: #b23cff;
      --pink: #ff3ec9;
      --cyan: #27e6ff;

      --text: #f8efff;
      --muted: #c7b2d8;

      --panel:
        linear-gradient(
          145deg,
          rgba(75, 12, 117, 0.62),
          rgba(16, 0, 31, 0.88)
        );

      --border: rgba(194, 113, 255, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--background-dark);
    }

    body {
      min-height: 100vh;
      margin: 0;

      color: var(--text);
      background: var(--background-dark);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow-x: hidden;
      position: relative;
      isolation: isolate;
    }

    /* ------------------------------
       FULL-PAGE VAPORWAVE BACKGROUND
    ------------------------------ */

    .vapor-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(39, 230, 255, 0.42) 0%,
          rgba(82, 41, 191, 0.32) 28%,
          transparent 58%
        ),
        radial-gradient(
          circle at 10% 45%,
          rgba(255, 62, 201, 0.28),
          transparent 38%
        ),
        radial-gradient(
          circle at 90% 55%,
          rgba(39, 230, 255, 0.20),
          transparent 42%
        ),
        linear-gradient(
          180deg,
          #100020 0%,
          #28004a 34%,
          #16002d 68%,
          #07000d 100%
        );
    }

    /* Flat grid covering the full screen */

    .vapor-background::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255, 62, 201, 0.13) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(39, 230, 255, 0.11) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      mask-image:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.92),
          rgba(0, 0, 0, 0.55)
        );

      animation: backgroundGrid 18s linear infinite;
    }

    /* Perspective grid near the bottom */

    .floor-grid {
      position: absolute;
      left: -30%;
      right: -30%;
      bottom: -42vh;
      height: 92vh;

      background-image:
        linear-gradient(
          rgba(255, 62, 201, 0.34) 2px,
          transparent 2px
        ),
        linear-gradient(
          90deg,
          rgba(39, 230, 255, 0.25) 2px,
          transparent 2px
        );

      background-size: 72px 72px;

      transform:
        perspective(650px)
        rotateX(64deg);

      transform-origin: center top;

      filter:
        drop-shadow(0 0 8px rgba(255, 62, 201, 0.32));

      animation: floorMovement 10s linear infinite;
    }

    /* Floating colour clouds */

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.36;
    }

    .glow-one {
      width: 420px;
      height: 420px;
      top: 8%;
      left: -120px;
      background: var(--pink);
      animation: floatOne 13s ease-in-out infinite alternate;
    }

    .glow-two {
      width: 480px;
      height: 480px;
      top: 24%;
      right: -170px;
      background: var(--cyan);
      animation: floatTwo 16s ease-in-out infinite alternate;
    }

    .glow-three {
      width: 350px;
      height: 350px;
      bottom: -90px;
      left: 35%;
      background: var(--purple);
      animation: floatThree 11s ease-in-out infinite alternate;
    }

    /* Subtle CRT scanlines */

    .scanlines {
      position: absolute;
      inset: 0;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 3px,
          rgba(255, 255, 255, 0.025) 4px
        );

      opacity: 0.45;
      mix-blend-mode: overlay;
    }

    /* ------------------------------
       PAGE LAYOUT
    ------------------------------ */

    .site {
      position: relative;
      z-index: 1;

      width: min(1200px, 100%);
      min-height: 100vh;

      margin: 0 auto;
      padding:
        clamp(14px, 3vw, 36px)
        clamp(12px, 3vw, 28px)
        30px;
    }

    /* ------------------------------
       HERO
    ------------------------------ */

    .hero-stage {
      perspective: 1400px;
      margin-bottom: 16px;
    }

    .hero {
      --rotate-x: 0deg;
      --rotate-y: 0deg;
      --mouse-x: 50%;
      --mouse-y: 50%;
      --lift: 0px;

      position: relative;
      overflow: hidden;

      border: 1px solid rgba(199, 125, 255, 0.55);
      border-radius: 24px;

      background: #07000c;

      transform-style: preserve-3d;

      transform:
        perspective(1400px)
        rotateX(var(--rotate-x))
        rotateY(var(--rotate-y))
        translateY(var(--lift));

      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
        0 0 36px rgba(178, 60, 255, 0.22),
        -12px 0 35px rgba(39, 230, 255, 0.10),
        12px 0 35px rgba(255, 62, 201, 0.12);

      transition:
        transform 180ms ease-out,
        box-shadow 250ms ease;
    }

    .hero:hover {
      --lift: -5px;

      box-shadow:
        0 35px 90px rgba(0, 0, 0, 0.64),
        0 0 0 1px rgba(255, 255, 255, 0.06) inset,
        0 0 45px rgba(178, 60, 255, 0.32),
        -14px 0 38px rgba(39, 230, 255, 0.18),
        14px 0 42px rgba(255, 62, 201, 0.20);
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;

      transform: translateZ(24px) scale(1.002);
    }

    /* Moving shine following the cursor */

    .hero::after,
    .menu a::after {
      content: "";
      position: absolute;
      inset: 0;

      border-radius: inherit;

      background:
        radial-gradient(
          circle at var(--mouse-x) var(--mouse-y),
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0.04) 18%,
          transparent 43%
        );

      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .hero:hover::after,
    .menu a:hover::after {
      opacity: 1;
    }

    /* ------------------------------
       MENU
    ------------------------------ */

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 13px;
    }

    .menu a {
      --rotate-x: 0deg;
      --rotate-y: 0deg;
      --mouse-x: 50%;
      --mouse-y: 50%;
      --lift: 0px;

      position: relative;
      isolation: isolate;
      overflow: hidden;

      min-height: 110px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding: 18px;

      color: var(--text);
      text-decoration: none;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: var(--panel);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transform-style: preserve-3d;

      transform:
        perspective(900px)
        rotateX(var(--rotate-x))
        rotateY(var(--rotate-y))
        translateY(var(--lift));

      box-shadow:
        0 16px 34px rgba(0, 0, 0, 0.32),
        0 0 0 1px rgba(255, 255, 255, 0.035) inset,
        0 0 22px rgba(178, 60, 255, 0.10);

      transition:
        transform 180ms ease-out,
        border-color 220ms ease,
        box-shadow 220ms ease,
        background 220ms ease;
    }

    /* Bright neon strip */

    .menu a::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--cyan),
          var(--pink),
          transparent
        );

      opacity: 0.65;

      box-shadow:
        0 0 10px var(--cyan),
        0 0 14px var(--pink);
    }

    .menu a:hover {
      --lift: -8px;

      border-color: rgba(39, 230, 255, 0.88);

      background:
        linear-gradient(
          145deg,
          rgba(103, 23, 151, 0.72),
          rgba(18, 0, 39, 0.91)
        );

      box-shadow:
        0 24px 45px rgba(0, 0, 0, 0.42),
        -7px 0 24px rgba(39, 230, 255, 0.22),
        7px 0 28px rgba(255, 62, 201, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    }

    .menu a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    .number,
    .label {
      position: relative;
      z-index: 2;
      transform: translateZ(28px);
    }

    .number {
      color: var(--cyan);

      font:
        700 12px/1
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      letter-spacing: 0.16em;

      text-shadow:
        0 0 8px rgba(39, 230, 255, 0.65);
    }

    .label {
      font-size: clamp(16px, 1.5vw, 22px);
      font-weight: 750;
      letter-spacing: -0.025em;

      text-shadow:
        0 0 16px rgba(255, 62, 201, 0.15);
    }

    .menu-arrow {
      position: absolute;
      right: 17px;
      bottom: 16px;
      z-index: 2;

      color: var(--pink);
      font-size: 20px;

      opacity: 0;
      transform: translateX(-8px) translateZ(30px);

      transition:
        opacity 200ms ease,
        transform 200ms ease;
    }

    .menu a:hover .menu-arrow {
      opacity: 1;
      transform: translateX(0) translateZ(30px);
    }

    /* ------------------------------
       STATUS
    ------------------------------ */

    .status {
      width: fit-content;
      max-width: 100%;

      margin: 25px auto 8px;
      padding: 10px 17px;

      text-align: center;
      color: var(--muted);

      border: 1px solid rgba(190, 120, 255, 0.18);
      border-radius: 999px;

      background: rgba(11, 0, 23, 0.42);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      font:
        600 11px/1.5
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      letter-spacing: 0.1em;

      box-shadow:
        0 0 20px rgba(178, 60, 255, 0.08);
    }

    .status::before {
      content: "";
      display: inline-block;

      width: 7px;
      height: 7px;

      margin-right: 9px;

      border-radius: 50%;
      background: var(--cyan);

      box-shadow:
        0 0 8px var(--cyan),
        0 0 16px var(--cyan);

      animation: statusPulse 1.8s ease-in-out infinite;
    }

    /* ------------------------------
       ANIMATIONS
    ------------------------------ */

    @keyframes backgroundGrid {
      from {
        background-position: 0 0, 0 0;
      }

      to {
        background-position: 48px 48px, 48px 48px;
      }
    }

    @keyframes floorMovement {
      from {
        background-position: 0 0, 0 0;
      }

      to {
        background-position: 0 72px, 72px 0;
      }
    }

    @keyframes floatOne {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(100px, 70px, 0) scale(1.2);
      }
    }

    @keyframes floatTwo {
      from {
        transform: translate3d(0, 0, 0) scale(1.1);
      }

      to {
        transform: translate3d(-100px, 90px, 0) scale(0.9);
      }
    }

    @keyframes floatThree {
      from {
        transform: translate3d(-40px, 0, 0);
      }

      to {
        transform: translate3d(80px, -100px, 0);
      }
    }

    @keyframes statusPulse {
      0%,
      100% {
        opacity: 0.45;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    /* ------------------------------
       TABLET
    ------------------------------ */

    @media (max-width: 780px) {
      .site {
        padding: 12px 10px 28px;
      }

      .hero {
        border-radius: 16px;
      }

      .menu {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .menu a {
        min-height: 95px;
        padding: 15px;
        border-radius: 16px;
      }
    }

    /* ------------------------------
       MOBILE
    ------------------------------ */

    @media (max-width: 480px) {
      .site {
        padding-top:
          max(
            10px,
            env(safe-area-inset-top)
          );
      }

      .hero-stage {
        margin-bottom: 18px;
      }

      .menu {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .menu a {
        min-height: 112px;
        padding: 18px;
      }

      .label {
        font-size: 20px;
      }

      .menu-arrow {
        opacity: 0.7;
        transform: none;
      }

      .status {
        width: 95%;
        font-size: 10px;
        border-radius: 16px;
      }

      .floor-grid {
        bottom: -24vh;
      }
    }

    /* Disable heavy movement for accessibility */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Full-screen coded vaporwave background -->
  <div class="vapor-background" aria-hidden="true">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="glow glow-three"></div>
    <div class="floor-grid"></div>
    <div class="scanlines"></div>
  </div>

  <main class="site">

    <div class="hero-stage">
      <section class="hero tilt-element" data-tilt-strength="7">
        <img
          src="darwase-hero.png"
          alt="Darwase neon synthwave artwork"
        >
      </section>
    </div>

    <nav class="menu" aria-label="Darwase sections">

      <a
        href="#about"
        class="tilt-element"
        data-tilt-strength="8"
        data-section="About Me"
      >
        <span class="number">00 // PROFILE.EXE</span>
        <span class="label">About Me</span>
        <span class="menu-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        href="#discovery"
        class="tilt-element"
        data-tilt-strength="8"
        data-section="Islamic Discovery"
      >
        <span class="number">01 // DISCOVERY.EXE</span>
        <span class="label">Islamic Discovery</span>
        <span class="menu-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        href="#prompts"
        class="tilt-element"
        data-tilt-strength="8"
        data-section="Free Prompts"
      >
        <span class="number">02 // PROMPTS.EXE</span>
        <span class="label">Free Prompts</span>
        <span class="menu-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        href="#labs"
        class="tilt-element"
        data-tilt-strength="8"
        data-section="Labs"
      >
        <span class="number">03 // LABS.EXE</span>
        <span class="label">Labs</span>
        <span class="menu-arrow" aria-hidden="true">↗</span>
      </a>

    </nav>

    <p class="status" id="status" aria-live="polite">
      DARWASE / SYSTEM ACTIVE / MORE COMING SOON
    </p>

  </main>

  <script>
    const statusMessage =
      document.getElementById("status");

    const defaultStatus =
      "DARWASE / SYSTEM ACTIVE / MORE COMING SOON";

    let statusTimer;

    /*
      Menu click behaviour
    */

    document.querySelectorAll(".menu a").forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();

        const sectionName =
          link.dataset.section || "SECTION";

        clearTimeout(statusTimer);

        statusMessage.textContent =
          `${sectionName.toUpperCase()} / UNDER CONSTRUCTION`;

        statusTimer = setTimeout(() => {
          statusMessage.textContent = defaultStatus;
        }, 1800);
      });
    });

    /*
      Real mouse-controlled 3D tilt.

      Disabled automatically for touch devices
      and reduced-motion users.
    */

    const supportsHover =
      window.matchMedia(
        "(hover: hover) and (pointer: fine)"
      ).matches;

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

    if (supportsHover && !reducedMotion) {
      document
        .querySelectorAll(".tilt-element")
        .forEach((element) => {
          const strength =
            Number(element.dataset.tiltStrength) || 6;

          element.addEventListener(
            "pointermove",
            (event) => {
              const rectangle =
                element.getBoundingClientRect();

              const mouseX =
                event.clientX - rectangle.left;

              const mouseY =
                event.clientY - rectangle.top;

              const percentageX =
                mouseX / rectangle.width;

              const percentageY =
                mouseY / rectangle.height;

              const rotateY =
                (percentageX - 0.5) * strength;

              const rotateX =
                (0.5 - percentageY) * strength;

              element.style.setProperty(
                "--rotate-x",
                `${rotateX}deg`
              );

              element.style.setProperty(
                "--rotate-y",
                `${rotateY}deg`
              );

              element.style.setProperty(
                "--mouse-x",
                `${percentageX * 100}%`
              );

              element.style.setProperty(
                "--mouse-y",
                `${percentageY * 100}%`
              );
            }
          );

          element.addEventListener(
            "pointerleave",
            () => {
              element.style.setProperty(
                "--rotate-x",
                "0deg"
              );

              element.style.setProperty(
                "--rotate-y",
                "0deg"
              );

              element.style.setProperty(
                "--mouse-x",
                "50%"
              );

              element.style.setProperty(
                "--mouse-y",
                "50%"
              );
            }
          );
        });
    }
  </script>

</body>
</html>
