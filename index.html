<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#10001d">

  <meta
    name="description"
    content="Darwase — 21st-Century Renaissance Man"
  >

  <title>Darwase</title>

  <style>
    :root {
      --bg-dark: #07000d;
      --bg-purple: #1b0038;

      --purple: #b23cff;
      --pink: #ff3ec9;
      --cyan: #27e6ff;

      --text: #f8efff;
      --muted: #c7b2d8;

      --panel:
        linear-gradient(
          145deg,
          rgba(75, 12, 117, 0.62),
          rgba(16, 0, 31, 0.88)
        );

      --border: rgba(194, 113, 255, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      background: var(--bg-dark);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      margin: 0;

      color: var(--text);
      background: var(--bg-dark);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow-x: hidden;
      position: relative;
      isolation: isolate;
    }

    img {
      display: block;
      max-width: 100%;
    }

    /* =====================================
       FULL-PAGE VAPORWAVE BACKGROUND
    ===================================== */

    .vapor-background {
      position: fixed;
      inset: 0;
      z-index: 0;

      overflow: hidden;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(39, 230, 255, 0.42) 0%,
          rgba(82, 41, 191, 0.32) 28%,
          transparent 58%
        ),
        radial-gradient(
          circle at 10% 45%,
          rgba(255, 62, 201, 0.28),
          transparent 38%
        ),
        radial-gradient(
          circle at 90% 55%,
          rgba(39, 230, 255, 0.2),
          transparent 42%
        ),
        linear-gradient(
          180deg,
          #100020 0%,
          #28004a 34%,
          #16002d 68%,
          #07000d 100%
        );
    }

    .vapor-background::before {
      content: "";

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255, 62, 201, 0.13) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(39, 230, 255, 0.11) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      -webkit-mask-image:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.9),
          rgba(0, 0, 0, 0.45)
        );

      mask-image:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.9),
          rgba(0, 0, 0, 0.45)
        );

      animation: backgroundGrid 18s linear infinite;
    }

    .floor-grid {
      position: absolute;

      left: -35%;
      right: -35%;
      bottom: -42vh;

      height: 100vh;

      background-image:
        linear-gradient(
          rgba(255, 62, 201, 0.4) 2px,
          transparent 2px
        ),
        linear-gradient(
          90deg,
          rgba(39, 230, 255, 0.3) 2px,
          transparent 2px
        );

      background-size: 74px 74px;

      transform:
        perspective(650px)
        rotateX(64deg);

      transform-origin: center top;

      filter:
        drop-shadow(
          0 0 8px
          rgba(255, 62, 201, 0.36)
        );

      animation: floorMovement 10s linear infinite;
    }

    .glow {
      position: absolute;

      border-radius: 50%;
      filter: blur(90px);

      opacity: 0.36;
    }

    .glow-one {
      width: 420px;
      height: 420px;

      top: 8%;
      left: -120px;

      background: var(--pink);

      animation:
        floatOne 13s ease-in-out infinite alternate;
    }

    .glow-two {
      width: 480px;
      height: 480px;

      top: 24%;
      right: -170px;

      background: var(--cyan);

      animation:
        floatTwo 16s ease-in-out infinite alternate;
    }

    .glow-three {
      width: 350px;
      height: 350px;

      bottom: -90px;
      left: 35%;

      background: var(--purple);

      animation:
        floatThree 11s ease-in-out infinite alternate;
    }

    .scanlines {
      position: absolute;
      inset: 0;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 3px,
          rgba(255, 255, 255, 0.025) 4px
        );

      opacity: 0.45;
      mix-blend-mode: overlay;
    }

    /* =====================================
       PAGE
    ===================================== */

    .site {
      position: relative;
      z-index: 1;

      width: min(1200px, 100%);
      min-height: 100vh;
      min-height: 100dvh;

      margin: 0 auto;

      padding:
        clamp(14px, 3vw, 36px)
        clamp(12px, 3vw, 28px)
        36px;
    }

    /* =====================================
       HERO
    ===================================== */

    .hero-stage {
      position: relative;

      display: grid;
      place-items: center;

      min-height: clamp(500px, 62vw, 720px);
      margin-bottom: clamp(8px, 1.5vw, 20px);

      perspective: 1400px;
    }

    .logo-scene {
      --rotate-x: 0deg;
      --rotate-y: 0deg;
      --lift: 0px;
      --mouse-x: 50%;
      --mouse-y: 50%;

      position: relative;

      width: min(1050px, 98%);
      height: clamp(460px, 58vw, 660px);

      transform-style: preserve-3d;

      transform:
        perspective(1400px)
        rotateX(var(--rotate-x))
        rotateY(var(--rotate-y))
        translateY(var(--lift));

      transition:
        transform 180ms ease-out,
        filter 250ms ease;
    }

    .logo-scene:hover {
      --lift: -7px;
    }

    .logo-scene::before {
      content: "";

      position: absolute;
      inset: 4%;

      z-index: 5;

      pointer-events: none;
      border-radius: 50%;

      background:
        radial-gradient(
          circle at var(--mouse-x) var(--mouse-y),
          rgba(255, 255, 255, 0.16),
          rgba(255, 255, 255, 0.035) 20%,
          transparent 46%
        );

      opacity: 0;

      transition: opacity 220ms ease;
    }

    .logo-scene:hover::before {
      opacity: 1;
    }

    /* Glow behind the whole logo */

    .logo-glow {
      position: absolute;
      z-index: 0;

      left: 50%;
      top: 8%;

      width: 76%;
      height: 78%;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 62, 201, 0.44) 0%,
          rgba(178, 60, 255, 0.24) 35%,
          rgba(39, 230, 255, 0.13) 53%,
          transparent 73%
        );

      filter: blur(42px);

      transform:
        translateX(-50%)
        translateZ(-50px);

      animation:
        logoGlowPulse 4s ease-in-out infinite;
    }

    /* Sun on top */

    .logo-sun {
      position: absolute;

      z-index: 1;

      top: 1%;
      left: 50%;

      width: clamp(190px, 31%, 330px);
      aspect-ratio: 1;

      border-radius: 50%;

      transform:
        translateX(-50%)
        translateZ(10px);

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 18px,
          rgba(51, 0, 74, 0.8) 19px,
          rgba(51, 0, 74, 0.8) 25px
        ),
        linear-gradient(
          180deg,
          #ffe45c 0%,
          #ff7a68 35%,
          #ff3ec9 70%,
          #b23cff 100%
        );

      box-shadow:
        0 0 18px rgba(255, 62, 201, 0.95),
        0 0 45px rgba(255, 62, 201, 0.6),
        0 0 80px rgba(178, 60, 255, 0.35);

      animation:
        sunPulse 4.5s ease-in-out infinite;
    }

    /* DARWASE placed below the sun */

    .darwase-wordmark {
      position: absolute;

      z-index: 3;

      top: 27%;
      left: 55%;

      width: 96%;
      height: auto;

      transform:
        translateX(-50%)
        translateZ(75px);

      filter:
        drop-shadow(
          0 24px 20px
          rgba(0, 0, 0, 0.55)
        )
        drop-shadow(
          0 0 11px
          rgba(39, 230, 255, 0.6)
        )
        drop-shadow(
          0 0 24px
          rgba(255, 62, 201, 0.52)
        );

      animation:
        wordmarkFloat 5s ease-in-out infinite;
    }

    .logo-reflection {
      position: absolute;

      z-index: 1;

      left: 10%;
      right: 10%;
      bottom: -1%;

      height: 18%;

      background:
        linear-gradient(
          to bottom,
          rgba(255, 62, 201, 0.2),
          rgba(39, 230, 255, 0.09),
          transparent 82%
        );

      filter: blur(17px);

      transform:
        translateZ(10px)
        perspective(500px)
        rotateX(66deg);

      opacity: 0.8;
      pointer-events: none;
    }

    /* =====================================
       MENU
    ===================================== */

    .menu {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 13px;
    }

    .menu a {
      --rotate-x: 0deg;
      --rotate-y: 0deg;
      --mouse-x: 50%;
      --mouse-y: 50%;
      --lift: 0px;

      position: relative;
      isolation: isolate;
      overflow: hidden;

      min-height: 110px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding: 18px;

      color: var(--text);
      text-decoration: none;

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      background: var(--panel);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      transform-style: preserve-3d;

      transform:
        perspective(900px)
        rotateX(var(--rotate-x))
        rotateY(var(--rotate-y))
        translateY(var(--lift));

      box-shadow:
        0 16px 34px rgba(0, 0, 0, 0.32),
        0 0 0 1px rgba(255, 255, 255, 0.035) inset,
        0 0 22px rgba(178, 60, 255, 0.1);

      transition:
        transform 180ms ease-out,
        border-color 220ms ease,
        box-shadow 220ms ease,
        background 220ms ease;
    }

    .menu a::before {
      content: "";

      position: absolute;

      top: 0;
      left: 12%;
      right: 12%;

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--cyan),
          var(--pink),
          transparent
        );

      opacity: 0.7;

      box-shadow:
        0 0 10px var(--cyan),
        0 0 14px var(--pink);
    }

    .menu a::after {
      content: "";

      position: absolute;
      inset: 0;

      border-radius: inherit;

      background:
        radial-gradient(
          circle at var(--mouse-x) var(--mouse-y),
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0.04) 18%,
          transparent 43%
        );

      opacity: 0;
      pointer-events: none;

      transition: opacity 220ms ease;
    }

    .menu a:hover::after {
      opacity: 1;
    }

    .menu a:hover {
      --lift: -8px;

      border-color:
        rgba(39, 230, 255, 0.88);

      background:
        linear-gradient(
          145deg,
          rgba(103, 23, 151, 0.72),
          rgba(18, 0, 39, 0.91)
        );

      box-shadow:
        0 24px 45px rgba(0, 0, 0, 0.42),
        -7px 0 24px rgba(39, 230, 255, 0.22),
        7px 0 28px rgba(255, 62, 201, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    }

    .menu a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    .number,
    .label,
    .menu-arrow {
      position: relative;
      z-index: 2;
    }

    .number,
    .label {
      transform: translateZ(28px);
    }

    .number {
      color: var(--cyan);

      font:
        700 12px/1.15
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      letter-spacing: 0.14em;

      text-shadow:
        0 0 8px
        rgba(39, 230, 255, 0.65);
    }

    .label {
      font-size:
        clamp(16px, 1.5vw, 22px);

      font-weight: 750;
      letter-spacing: -0.025em;

      text-shadow:
        0 0 16px
        rgba(255, 62, 201, 0.15);
    }

    .menu-arrow {
      position: absolute;

      right: 17px;
      bottom: 16px;

      color: var(--pink);
      font-size: 20px;

      opacity: 0;

      transform:
        translateX(-8px)
        translateZ(30px);

      transition:
        opacity 200ms ease,
        transform 200ms ease;
    }

    .menu a:hover .menu-arrow {
      opacity: 1;

      transform:
        translateX(0)
        translateZ(30px);
    }

    /* =====================================
       STATUS
    ===================================== */

    .status {
      width: fit-content;
      max-width: 100%;

      margin: 25px auto 8px;
      padding: 10px 17px;

      text-align: center;
      color: var(--muted);

      border:
        1px solid
        rgba(190, 120, 255, 0.18);

      border-radius: 999px;

      background:
        rgba(11, 0, 23, 0.48);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      font:
        600 11px/1.5
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      letter-spacing: 0.1em;

      box-shadow:
        0 0 20px
        rgba(178, 60, 255, 0.08);
    }

    .status::before {
      content: "";

      display: inline-block;

      width: 7px;
      height: 7px;

      margin-right: 9px;

      border-radius: 50%;

      background: var(--cyan);

      box-shadow:
        0 0 8px var(--cyan),
        0 0 16px var(--cyan);

      animation:
        statusPulse 1.8s
        ease-in-out infinite;
    }

    /* =====================================
       ANIMATIONS
    ===================================== */

    @keyframes backgroundGrid {
      from {
        background-position:
          0 0,
          0 0;
      }

      to {
        background-position:
          48px 48px,
          48px 48px;
      }
    }

    @keyframes floorMovement {
      from {
        background-position:
          0 0,
          0 0;
      }

      to {
        background-position:
          0 74px,
          74px 0;
      }
    }

    @keyframes floatOne {
      from {
        transform:
          translate3d(0, 0, 0)
          scale(1);
      }

      to {
        transform:
          translate3d(100px, 70px, 0)
          scale(1.2);
      }
    }

    @keyframes floatTwo {
      from {
        transform:
          translate3d(0, 0, 0)
          scale(1.1);
      }

      to {
        transform:
          translate3d(-100px, 90px, 0)
          scale(0.9);
      }
    }

    @keyframes floatThree {
      from {
        transform:
          translate3d(-40px, 0, 0);
      }

      to {
        transform:
          translate3d(80px, -100px, 0);
      }
    }

    @keyframes wordmarkFloat {
      0%,
      100% {
        margin-top: 0;
      }

      50% {
        margin-top: -7px;
      }
    }

    @keyframes logoGlowPulse {
      0%,
      100% {
        opacity: 0.65;

        transform:
          translateX(-50%)
          translateZ(-50px)
          scale(0.96);
      }

      50% {
        opacity: 1;

        transform:
          translateX(-50%)
          translateZ(-50px)
          scale(1.06);
      }
    }

    @keyframes sunPulse {
      0%,
      100% {
        filter: brightness(0.95);
      }

      50% {
        filter: brightness(1.15);
      }
    }

    @keyframes statusPulse {
      0%,
      100% {
        opacity: 0.45;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    /* =====================================
       TABLET
    ===================================== */

    @media (max-width: 780px) {
      .site {
        padding:
          12px
          10px
          28px;
      }

      .hero-stage {
        min-height: 540px;
      }

      .logo-scene {
        width: 100%;
        height: 510px;
      }

      .logo-sun {
        top: 4%;
        width: clamp(190px, 39%, 270px);
      }

      .darwase-wordmark {
        top: 38%;
        width: 100%;
      }

      .menu {
        grid-template-columns:
          1fr 1fr;

        gap: 10px;
      }

      .menu a {
        min-height: 96px;
        padding: 15px;

        border-radius: 16px;
      }
    }

    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 480px) {
      .site {
        padding-top:
          max(
            10px,
            env(safe-area-inset-top)
          );

        padding-bottom:
          max(
            26px,
            env(safe-area-inset-bottom)
          );
      }

      .hero-stage {
        min-height: 415px;
        margin-bottom: 8px;
      }

      .logo-scene {
        width: 112%;
        height: 395px;
      }

      .logo-sun {
        top: 3%;
        width: 47%;
        max-width: 190px;
      }

      .darwase-wordmark {
        top: 39%;
        width: 105%;
      }

      .logo-reflection {
        bottom: 0;
      }

      .menu {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .menu a {
        min-height: 112px;
        padding: 18px;
      }

      .label {
        font-size: 20px;
      }

      .menu-arrow {
        opacity: 0.7;
        transform: none;
      }

      .status {
        width: 95%;

        font-size: 10px;
        border-radius: 16px;
      }

      .floor-grid {
        bottom: -24vh;
      }
    }

    /* =====================================
       ACCESSIBILITY
    ===================================== */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div
    class="vapor-background"
    aria-hidden="true"
  >
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="glow glow-three"></div>

    <div class="floor-grid"></div>
    <div class="scanlines"></div>
  </div>

  <main class="site">

    <section class="hero-stage">

      <div
        class="logo-scene tilt-element"
        data-tilt-strength="7"
        aria-label="Darwase"
      >
        <div class="logo-glow"></div>

        <div class="logo-sun"></div>

        <img
          class="darwase-wordmark"
          src="./darwase-wordmark-final.png"
          alt="Darwase"
        >

        <div
          class="logo-reflection"
          aria-hidden="true"
        ></div>
      </div>

    </section>

    <nav
      class="menu"
      aria-label="Darwase sections"
    >

      <a
        href="#about"
        class="tilt-element"
        data-tilt-strength="8"
        data-section="About Me"
      >
        <span class="number">
          00 // PROFILE.EXE
        </span>

        <span class="label">
          About Me
        </span>

        <span
          class="menu-arrow"
          aria-hidden="true"
        >
          ↗
        </span>
      </a>

      <a
        href="#discovery"
        class="tilt-element"
        data-tilt-strength="8"
        data-section="Islamic Discovery"
      >
        <span class="number">
          01 // DISCOVERY.EXE
        </span>

        <span class="label">
          Islamic Discovery
        </span>

        <span
          class="menu-arrow"
          aria-hidden="true"
        >
          ↗
        </span>
      </a>

      <a
        href="#prompts"
        class="tilt-element"
        data-tilt-strength="8"
        data-section="Free Prompts"
      >
        <span class="number">
          02 // PROMPTS.EXE
        </span>

        <span class="label">
          Free Prompts
        </span>

        <span
          class="menu-arrow"
          aria-hidden="true"
        >
          ↗
        </span>
      </a>

      <a
        href="#labs"
        class="tilt-element"
        data-tilt-strength="8"
        data-section="Labs"
      >
        <span class="number">
          03 // LABS.EXE
        </span>

        <span class="label">
          Labs
        </span>

        <span
          class="menu-arrow"
          aria-hidden="true"
        >
          ↗
        </span>
      </a>

    </nav>

    <p
      class="status"
      id="status"
      aria-live="polite"
    >
      DARWASE / SYSTEM ACTIVE / MORE COMING SOON
    </p>

  </main>

  <script>
    const statusMessage =
      document.getElementById("status");

    const defaultStatus =
      "DARWASE / SYSTEM ACTIVE / MORE COMING SOON";

    let statusTimer;

    document
      .querySelectorAll(".menu a")
      .forEach((link) => {
        link.addEventListener(
          "click",
          (event) => {
            event.preventDefault();

            const sectionName =
              link.dataset.section ||
              "SECTION";

            clearTimeout(statusTimer);

            statusMessage.textContent =
              `${sectionName.toUpperCase()} / UNDER CONSTRUCTION`;

            statusTimer =
              setTimeout(() => {
                statusMessage.textContent =
                  defaultStatus;
              }, 1800);
          }
        );
      });

    const supportsHover =
      window.matchMedia(
        "(hover: hover) and (pointer: fine)"
      ).matches;

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

    if (
      supportsHover &&
      !reducedMotion
    ) {
      document
        .querySelectorAll(".tilt-element")
        .forEach((element) => {
          const strength =
            Number(
              element.dataset.tiltStrength
            ) || 6;

          element.addEventListener(
            "pointermove",
            (event) => {
              const rectangle =
                element.getBoundingClientRect();

              const mouseX =
                event.clientX -
                rectangle.left;

              const mouseY =
                event.clientY -
                rectangle.top;

              const percentageX =
                mouseX /
                rectangle.width;

              const percentageY =
                mouseY /
                rectangle.height;

              const rotateY =
                (percentageX - 0.5) *
                strength;

              const rotateX =
                (0.5 - percentageY) *
                strength;

              element.style.setProperty(
                "--rotate-x",
                `${rotateX}deg`
              );

              element.style.setProperty(
                "--rotate-y",
                `${rotateY}deg`
              );

              element.style.setProperty(
                "--mouse-x",
                `${percentageX * 100}%`
              );

              element.style.setProperty(
                "--mouse-y",
                `${percentageY * 100}%`
              );
            }
          );

          element.addEventListener(
            "pointerleave",
            () => {
              element.style.setProperty(
                "--rotate-x",
                "0deg"
              );

              element.style.setProperty(
                "--rotate-y",
                "0deg"
              );

              element.style.setProperty(
                "--mouse-x",
                "50%"
              );

              element.style.setProperty(
                "--mouse-y",
                "50%"
              );
            }
          );
        });
    }
  </script>

</body>
</html>
